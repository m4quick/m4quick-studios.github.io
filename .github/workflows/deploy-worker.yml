name: Deploy intake worker

# The static site publishes to GitHub Pages on push. The Cloudflare Worker
# behind /api/* does NOT — it has always been deployed by hand, which is how
# a broken sending path stayed live in production unnoticed. This closes
# that gap: the worker now ships from the same push as everything else.
#
# Prod source lives in Gitea and mirrors to GitHub; this runs on the GitHub
# side. Actions must be enabled on the mirrored repo for it to fire.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   scoped to "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main, master]
    # Only when the worker itself changes — editing a page should not
    # redeploy the backend that receives intake forms.
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check worker parses
        run: node --check worker/worker.js

      - name: Refuse to deploy with an unset KV namespace
        run: |
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' worker/wrangler.toml; then
            echo "::error::wrangler.toml still contains the KV placeholder."
            echo "Every intake is written to KV before any notification is sent."
            echo "Deploying without it would silently drop that guarantee."
            echo ""
            echo "Fix: wrangler kv namespace create SUBMISSIONS"
            echo "     then paste the returned id into worker/wrangler.toml"
            exit 1
          fi
          echo "KV namespace configured"

      - name: Block a return to Mailgun
        run: |
          if grep -q 'api\.mailgun\.net' worker/worker.js; then
            echo "::error::worker.js is calling the Mailgun API again."
            echo "Mailgun returned 401 on every send this account ever made,"
            echo "so no intake notification reached the inbox. Mail goes out"
            echo "through Graph from intake@m4quickstudios.com, which aligns"
            echo "with the domain's own SPF, DKIM and DMARC."
            exit 1
          fi
          echo "No Mailgun call present"

      - name: Check the sending identity is on the real domain
        run: |
          if ! grep -q "SEND_AS = 'intake@m4quickstudios.com'" worker/worker.js; then
            echo "::error::SEND_AS is not intake@m4quickstudios.com."
            echo "Graph will only send as a mailbox the app policy permits,"
            echo "and DKIM only aligns for this domain."
            exit 1
          fi
          echo "Sending identity looks correct"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Done
        run: |
          echo "Worker deployed."
          echo "Secrets (GRAPH_*, TELEGRAM_*, TEST_KEY, TURNSTILE_*)"
          echo "are set on the worker itself and are not touched by this job."
