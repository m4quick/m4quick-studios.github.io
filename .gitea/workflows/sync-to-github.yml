name: Sync to GitHub

# This file is mirrored to a PUBLIC GitHub repo, so nothing in it may name
# internal hosts, usernames or addresses. The staging target lives in the
# HOST1_TARGET secret (format: user@host) rather than inline.

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitHub
        run: |
          git remote add github "https://x-access-token:${GH_SYNC_TOKEN}@github.com/m4quick/m4quick-studios.github.io.git"
          git push github HEAD:main
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}

      - name: Deploy to host1 staging
        run: |
          if [ -z "$HOST1_TARGET" ]; then
            echo "HOST1_TARGET is not set — add it as a Gitea secret in the form user@host."
            echo "Skipping staging deploy; the GitHub sync above already succeeded."
            exit 0
          fi
          if [ -z "$HOST1_KNOWN_HOSTS" ]; then
            echo "HOST1_KNOWN_HOSTS is not set, so the staging host cannot be verified."
            echo "Skipping rather than connecting without host-key checking: this step"
            echo "hands a private deploy key to whatever answers at that address, and"
            echo "an unverified connection is exactly how that key reaches the wrong host."
            echo ""
            echo "Generate the value on a trusted machine, on the same network:"
            echo "    ssh-keyscan -H <host>"
            echo "and store the full output as the HOST1_KNOWN_HOSTS Gitea secret."
            echo ""
            echo "The GitHub sync above already succeeded; only staging was skipped."
            exit 0
          fi
          apt-get update -qq && apt-get install -y -qq openssh-client rsync > /dev/null
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST1_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          rsync -a --delete --exclude='.git' --exclude='.gitea' --exclude='.github' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "${HOST1_TARGET}:"
        env:
          DEPLOY_KEY: ${{ secrets.HOST1_DEPLOY_KEY }}
          HOST1_TARGET: ${{ secrets.HOST1_TARGET }}
          HOST1_KNOWN_HOSTS: ${{ secrets.HOST1_KNOWN_HOSTS }}
