name: Sync to GitHub

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitHub
        run: |
          git remote add github "https://x-access-token:${GH_SYNC_TOKEN}@github.com/m4quick/m4quick-studios.github.io.git"
          git push github HEAD:main
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}

      - name: Deploy to host1 staging
        run: |
          apt-get update -qq && apt-get install -y -qq openssh-client rsync > /dev/null
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -a --delete --exclude='.git' --exclude='.gitea' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ anu-sir@10.0.0.254:
        env:
          DEPLOY_KEY: ${{ secrets.HOST1_DEPLOY_KEY }}
